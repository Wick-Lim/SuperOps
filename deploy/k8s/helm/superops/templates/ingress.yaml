{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "superops.fullname" . }}
  labels:
    {{- include "superops.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- else if and .Values.ingress.tls.enabled .Values.ingress.tls.issuer }}
    cert-manager.io/issuer: {{ .Values.ingress.tls.issuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          # WebSockets ride this rule; the proxy-read/send-timeout annotations
          # are what keep them alive past the controller's 60s default.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "superops.fullname" . }}-backend
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "superops.fullname" . }}-backend
                port:
                  number: 8080
          # /ready and /metrics are deliberately not routed from outside.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "superops.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}

{{- /*
Rendered from plaintext Helm values, so these credentials also live in the
release Secret and in `helm get values` output. For anything beyond a trial,
disable this template and point the workloads at External Secrets / SOPS /
sealed-secrets instead.

The `required` calls turn a missing secret into a render-time error rather than
a CrashLoopBackOff twenty seconds after install.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "superops.fullname" . }}-secret
  labels:
    {{- include "superops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.externalDatabase.url }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
  DB_PASSWORD: {{ if .Values.postgresql.enabled }}{{ required "postgresql.auth.password is required" .Values.postgresql.auth.password | quote }}{{ else }}{{ .Values.postgresql.auth.password | quote }}{{ end }}
  REDIS_PASSWORD: {{ if .Values.redis.enabled }}{{ required "redis.auth.password is required" .Values.redis.auth.password | quote }}{{ else }}{{ .Values.redis.auth.password | quote }}{{ end }}
  JWT_SECRET: {{ required "jwt.secret is required (>= 32 bytes)" .Values.jwt.secret | quote }}
  ADMIN_PASSWORD: {{ required "admin.password is required — LoadConfig fatals without ADMIN_PASSWORD" .Values.admin.password | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_SECRET_KEY: {{ if .Values.minio.enabled }}{{ required "minio.auth.rootPassword is required" .Values.minio.auth.rootPassword | quote }}{{ else }}{{ .Values.minio.auth.rootPassword | quote }}{{ end }}
  {{- if and .Values.search.enabled .Values.externalMeilisearch.masterKey }}
  MEILI_MASTER_KEY: {{ .Values.externalMeilisearch.masterKey | quote }}
  {{- end }}
  {{- if .Values.metrics.token }}
  METRICS_TOKEN: {{ .Values.metrics.token | quote }}
  {{- end }}
  {{- /* Expo access token. Only required when the Expo project has "enhanced
  push security" enabled; `default dict` keeps older values files rendering. */ -}}
  {{- $push := .Values.push | default dict }}
  {{- if and $push.enabled $push.accessToken }}
  EXPO_ACCESS_TOKEN: {{ $push.accessToken | quote }}
  {{- end }}
  {{- /*
  Outbound mail credentials. These belong here and NOT in the ConfigMap: a
  ConfigMap is readable by anything with get/list on the namespace, and an SMTP
  password or a Resend key is a live send-as-your-domain capability.

  Everything non-secret about mail (transport, host, port, TLS mode, From) is in
  the ConfigMap. Splitting one setting across the two is the silent trap the
  chart is meant to avoid, so each variable appears in exactly one template.
  */ -}}
  {{- $mail := .Values.mail | default dict }}
  {{- $transport := $mail.transport | default "log" }}
  {{- $smtp := $mail.smtp | default dict }}
  {{- if and (eq $transport "smtp") $smtp.username }}
  {{- /* The backend fatals when exactly one of the pair is set, so require the
  password as soon as a username is given. */}}
  MAIL_SMTP_PASSWORD: {{ required "mail.smtp.password is required when mail.smtp.username is set — the backend refuses to start with only one of the pair" $smtp.password | quote }}
  {{- end }}
  {{- if eq $transport "resend" }}
  MAIL_RESEND_API_KEY: {{ required "mail.resend.apiKey is required when mail.transport is \"resend\"" ($mail.resend | default dict).apiKey | quote }}
  {{- end }}
  {{- $dkim := ($mail.direct | default dict).dkim | default dict }}
  {{- if and (eq $transport "smtp-direct") $dkim.domain }}
  {{- /* A PEM block survives a Secret's stringData verbatim, so unlike the .env
  path there is no need to base64 the key by hand — the backend accepts either.
  Prefer External Secrets / SOPS over putting a signing key in a values file. */}}
  MAIL_DKIM_PRIVATE_KEY: {{ required "mail.direct.dkim.privateKey is required once mail.direct.dkim.domain is set — DKIM settings are all-or-nothing" $dkim.privateKey | quote }}
  {{- end }}
  {{- /*
  Single sign-on. SSO_SECRET_KEY is the AES-256 key that seals every workspace's
  OIDC client secret at rest, so it belongs here beside JWT_SECRET and never in
  the ConfigMap: one `kubectl get configmap -o yaml` would otherwise hand over
  every tenant's IdP credentials.

  It is also the on/off switch — empty means the SSO routes are not registered
  at all. Back it up: rotating it makes every stored client secret unopenable,
  and the only fix is re-entering each workspace's secret.

  Everything non-secret about SSO (the timeouts, the insecure-issuer flag) is in
  the ConfigMap; each variable appears in exactly one template.
  */ -}}
  {{- $sso := .Values.sso | default dict }}
  {{- if $sso.secretKey }}
  {{- /* Every accepted encoding of a 32-byte key is at least 32 characters (32
  raw, 43/44 base64, 64 hex), so anything shorter is a placeholder and would
  fail the backend's boot. Catching it at render time beats a CrashLoopBackOff.
  The full format check stays in the backend — one implementation, not two. */}}
  {{- if lt (len $sso.secretKey) 32 }}
  {{- fail "sso.secretKey must be a 32-byte key: 64 hex characters (openssl rand -hex 32), base64 of 32 bytes, or 32 raw characters" }}
  {{- end }}
  SSO_SECRET_KEY: {{ $sso.secretKey | quote }}
  {{- end }}
  {{- /*
  The HMAC key the http audit sink signs anchors with. It belongs here for the
  same reason SSO_SECRET_KEY does: a ConfigMap is readable by anything with
  get/list on the namespace, and an anchor the receiver cannot authenticate is
  an anchor anybody can forge — which is precisely the property the whole
  off-box anchoring layer exists to provide.
  */ -}}
  {{- $audit := .Values.audit | default dict }}
  {{- if and (eq ($audit.sink | default "log") "http") $audit.sinkSecret }}
  AUDIT_SINK_SECRET: {{ $audit.sinkSecret | quote }}
  {{- end }}

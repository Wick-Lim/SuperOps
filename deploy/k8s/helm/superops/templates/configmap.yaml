apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "superops.fullname" . }}-config
  labels:
    {{- include "superops.labels" . | nindent 4 }}
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  DB_HOST: "{{ include "superops.postgresqlHost" . }}"
  DB_PORT: "{{ include "superops.postgresqlPort" . }}"
  DB_NAME: {{ .Values.postgresql.auth.database | default "superops" | quote }}
  DB_USER: {{ .Values.postgresql.auth.username | default "superops" | quote }}
  DB_SSLMODE: {{ .Values.backend.env.DB_SSLMODE | default "disable" | quote }}
  DB_APPLICATION_NAME: "superops"
  REDIS_ADDR: "{{ include "superops.redisHost" . }}:6379"
  NATS_URL: "nats://{{ include "superops.natsHost" . }}:4222"
  MINIO_ENDPOINT: "{{ include "superops.minioHost" . }}:9000"
  MINIO_BUCKET: "superops"
  MINIO_USE_SSL: {{ .Values.backend.env.MINIO_USE_SSL | default "false" | quote }}
  FILES_ENABLED: {{ .Values.minio.enabled | toString | quote }}
  # Search only works against an externally provisioned Meilisearch — the chart
  # has no meilisearch dependency.
  SEARCH_ENABLED: {{ and .Values.search.enabled (ne (.Values.externalMeilisearch.host | default "") "") | toString | quote }}
  {{- if and .Values.search.enabled .Values.externalMeilisearch.host }}
  MEILI_HOST: {{ .Values.externalMeilisearch.host | quote }}
  {{- end }}
  {{- /*
  Push notifications. `default dict` so a values file that predates this block
  renders instead of failing on a nil map.

  PUSH_ENABLED only opens the device-registration endpoints and starts the
  worker's dispatcher. Delivery additionally requires APNs/FCM credentials on
  the Expo project itself, which live outside this cluster entirely.
  */ -}}
  {{- $push := .Values.push | default dict }}
  PUSH_ENABLED: {{ $push.enabled | default false | toString | quote }}
  {{- if $push.enabled }}
  PUSH_TIMEOUT: {{ $push.timeout | default "15s" | quote }}
  {{- if $push.endpoint }}
  EXPO_PUSH_ENDPOINT: {{ $push.endpoint | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := .Values.backend.env }}
  {{- /* Keys this template emits itself; a passthrough copy would be a
  duplicate map key in the rendered ConfigMap. Use `push.*` for these. */}}
  {{- if not (has $k (list "DB_SSLMODE" "MINIO_USE_SSL" "PUSH_ENABLED" "PUSH_TIMEOUT" "EXPO_PUSH_ENDPOINT")) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := .Values.backend.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  ADMIN_EMAIL: {{ required "admin.email is required — LoadConfig fatals without ADMIN_EMAIL" .Values.admin.email | quote }}
  ADMIN_USERNAME: {{ .Values.admin.username | default "admin" | quote }}

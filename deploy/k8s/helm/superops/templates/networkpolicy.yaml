{{- if .Values.networkPolicy.enabled }}
{{- /*
Default-deny for the application pods, then allow exactly what they need.

Off by default (values.yaml) because an incomplete policy fails closed: if your
CNI enforces NetworkPolicy and DNS or an in-cluster dependency is not covered
here, the app stops working with no obvious error. Review, then enable.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "superops.fullname" . }}-backend
  labels:
    {{- include "superops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "superops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Ingress, Egress]
  ingress:
    # HTTP/WebSocket from anywhere in the cluster (the ingress controller
    # usually lives in its own namespace, so this is not narrowed by namespace).
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres / Redis / NATS / MinIO — all part of this release.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 4222
          protocol: TCP
        - port: 9000
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "superops.fullname" . }}-worker
  labels:
    {{- include "superops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "superops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 4222
          protocol: TCP
        - port: 9000
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "superops.fullname" . }}-frontend
  labels:
    {{- include "superops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "superops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 80
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "superops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - port: 8080
          protocol: TCP
{{- end }}

global:
  domain: "superops.example.com"
  storageClass: ""

# --- Application images -------------------------------------------------------
backend:
  image:
    repository: ghcr.io/wick-lim/superops-backend
    # Empty means .Chart.AppVersion. Never use "latest" with
    # pullPolicy: IfNotPresent — nodes cache it forever and never see a new push.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  # WebSockets are hijacked connections: http.Server.Shutdown does not wait for
  # them, and the server takes 30s to drain. Give the pod room plus a preStop
  # pause so the endpoint is removed from Services before SIGTERM lands.
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 10
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    # CPU is a weak signal for a WebSocket server; connection count would be
    # better, but that needs a custom metrics adapter.
  pdb:
    enabled: true
    minAvailable: 1
  # Keeps the two replicas off a single node, without which a minAvailable: 1
  # PDB cannot actually protect availability during a node drain.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    LOG_LEVEL: "info"
    # Transport security — set to "require" (Postgres) / "true" (MinIO) once TLS
    # certs are provisioned for in-cluster traffic.
    DB_SSLMODE: "disable"
    MINIO_USE_SSL: "false"
    # The app sits behind the nginx ingress controller, which appends exactly
    # one hop to X-Forwarded-For.
    RATE_LIMIT_TRUST_PROXY: "true"
    RATE_LIMIT_TRUSTED_PROXY_HOPS: "1"
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_API_PER_MIN: "600"
    RATE_LIMIT_AUTH_PER_MIN: "10"
    # CORS — the bundled web client is same-origin, so list only the origins
    # that genuinely need cross-origin access. "*" is the unsafe default.
    CORS_ALLOWED_ORIGINS: "https://superops.example.com"
    SERVER_READ_TIMEOUT: "15s"
    SERVER_WRITE_TIMEOUT: "15s"
    SERVER_IDLE_TIMEOUT: "60s"
  # Extra env keys merged into the ConfigMap verbatim.
  extraEnv: {}

worker:
  replicas: 1
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  pdb:
    # A single-replica PDB with minAvailable: 1 blocks node drains outright, so
    # this stays off until the worker is actually scaled out.
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  image:
    repository: ghcr.io/wick-lim/superops-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  pdb:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: frontend
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Security -----------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Nothing in this app talks to the Kubernetes API.
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# nginx:1.27-alpine starts as root to bind :80 and drops to the nginx user for
# workers, and it writes to /var/cache/nginx and /var/run, so it cannot use the
# hardened context above. Those paths are backed by emptyDirs instead.
frontendPodSecurityContext:
  seccompProfile:
    type: RuntimeDefault
frontendSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]

networkPolicy:
  # Off by default: an incomplete policy fails closed and takes the app down.
  # Review the egress rules against your CNI and DNS setup, then enable.
  enabled: false
  # Extra egress rules (e.g. an external SMTP relay or object store).
  extraEgress: []

# --- Ingress ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    # WebSocket connections are long-lived; the controller default is 60s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # NOTE: `nginx.ingress.kubernetes.io/websocket-services` was removed — it is
    # not an ingress-nginx annotation (it belonged to the old kubernetes/contrib
    # controller) and did nothing.
  tls:
    enabled: true
    secretName: superops-tls
    # Set to a cert-manager (Cluster)Issuer name to have the certificate
    # provisioned automatically; otherwise create secretName out-of-band, or the
    # ingress serves the controller's self-signed default certificate.
    clusterIssuer: ""
    issuer: ""

# --- Application configuration ------------------------------------------------
jwt:
  secret: ""  # REQUIRED, >= 32 bytes

admin:
  # REQUIRED. LoadConfig treats a missing ADMIN_EMAIL/ADMIN_PASSWORD as fatal
  # (backend/internal/app/config.go), and all three binaries call it — so
  # without these the pre-upgrade migrate Job dies and the install aborts.
  # They seed the first administrator account on first boot.
  email: "admin@example.com"
  username: "admin"
  password: ""  # REQUIRED

metrics:
  # When set, GET /metrics requires this bearer token. /metrics is not routed
  # through the ingress either way.
  token: ""

# --- Single sign-on (OIDC) ----------------------------------------------------
# Empty secretKey disables SSO entirely: the /api/v1/auth/sso/* and
# /api/v1/workspaces/{id}/sso routes are not registered, and password login is
# unchanged.
#
# The provider itself (issuer, client id, client secret, whether SSO is
# enforced) is configured per workspace by a workspace administrator and stored
# in Postgres — one deployment serves several organizations, so it cannot live
# here. This is the deployment-level half.
sso:
  # AES-256 key sealing every workspace's OIDC client secret at rest, and the
  # on/off switch for the whole feature. -> Secret, beside JWT_SECRET; it is
  # never emitted into the ConfigMap.
  #
  #   openssl rand -hex 32
  #
  # Accepted as 64 hex characters, base64 of 32 bytes, or 32 raw characters; a
  # value that is none of those fails the boot rather than being truncated.
  # Back it up: rotating it makes every stored client secret unopenable and the
  # only fix is re-entering each workspace's secret. For anything beyond a
  # trial, leave it empty here and inject via External Secrets / SOPS.
  secretKey: ""  # -> Secret

  # Permit an http:// issuer and one that resolves to a loopback, private or
  # link-local address. LOCAL TEST PROVIDER ONLY.
  #
  # The issuer URL is supplied by a workspace administrator — a tenant, not the
  # cluster operator. With this on, any of them can point it at
  # http://169.254.169.254/ and read the node's metadata service (its IAM
  # credentials) through the API. The backend therefore REFUSES TO BOOT with
  # this on unless PUBLIC_BASE_URL is a loopback address, so setting it in a
  # real cluster produces a CrashLoopBackOff with an explicit error, not a
  # quiet SSRF primitive.
  allowInsecureIssuer: false

  # Timeouts and lifetimes; the defaults are shown and all are optional.
  # Bounds one call to the provider (discovery, JWKS, token exchange).
  httpTimeout: "10s"
  # How long a started sign-in stays completable.
  authRequestTTL: "10m"
  # Bounds the second step: the 2FA prompt or the account-link challenge.
  pendingTTL: "5m"
  # How long a fetched key set is served without revalidation. Rotation does not
  # wait for it — an unknown `kid` triggers a throttled refetch.
  jwksCacheTTL: "1h"
  # Tolerance applied to the ID token's `exp` and `iat`.
  clockSkew: "2m"

# --- Outbound email -----------------------------------------------------------
# Invitations are delivered by email. Left at "log" they are only written to the
# backend log and an admin has to copy the invite_url out of the API response by
# hand — which still works, and is the pre-existing behaviour.
#
# Which transport is correct is a property of the deployment, not a code
# decision. In a cloud cluster (EKS, GKE, AKS, DOKS) outbound port 25 is blocked
# by the provider, so `smtp` through a relay is the only thing that can work. On
# bare metal that permits outbound 25, `smtp-direct` delivers to the recipient's
# MX and keeps company mail off a third party.
#
# `smtp` covers Amazon SES, Postmark, SendGrid, Mailgun, Resend AND a corporate
# Exchange relay — every one of them exposes authenticated SMTP, and only `host`
# and the credentials differ. Switching providers is a values change, never a
# code change. `resend` is not "the Resend integration"; it is the escape hatch
# for a network where even 587/465 are blocked outbound.
#
# Secrets below (smtp.password, resend.apiKey, direct.dkim.privateKey) render
# into the release Secret, not the ConfigMap. For anything beyond a trial, leave
# them empty and inject via External Secrets / SOPS instead.
#
# Verify a live configuration with POST /api/v1/admin/mail/test — it sends to
# the calling admin's own address and returns the transport's real error.
mail:
  # log | smtp | smtp-direct | resend
  transport: "log"

  # Envelope and header sender, and what SPF/DMARC are evaluated against.
  # Required by the chart for every transport except "log".
  from: ""
  fromName: "SuperOps"

  # Absolute public root of the web client. Every link in every message is built
  # from it, so a relative or loopback value produces invitations nobody can
  # open. Required for every transport except "log".
  publicBaseURL: ""

  productName: "SuperOps"

  # Bounds one send attempt.
  timeout: "30s"
  # Per-IP limit on the admin mail test. Low on purpose — it triggers outbound
  # mail, so it does not inherit the general API rate limit.
  testPerMinute: 3

  # --- transport: smtp ---
  smtp:
    # e.g. email-smtp.eu-west-1.amazonaws.com | smtp.postmarkapp.com |
    #      smtp.sendgrid.net | smtp.eu.mailgun.org | smtp.resend.com
    host: ""
    port: 587
    username: ""
    password: ""  # -> Secret
    # starttls (587, default) | implicit (465) | none.
    # starttls REQUIRES the upgrade: a server that does not offer STARTTLS fails
    # the send rather than silently falling back to plaintext.
    tls: "starttls"
    # Permit credentials over an unencrypted connection. Only for an in-cluster
    # relay with tls: none; SMTP AUTH PLAIN is the password in base64.
    allowInsecureAuth: false
    # For a relay whose private CA is not in the image's trust store.
    insecureSkipVerify: false
    # EHLO name. Empty is fine — an authenticated relay authenticates the
    # session instead of trusting this.
    helo: ""

  # --- transport: smtp-direct (bare metal only) ---
  direct:
    # REQUIRED for this transport: the public FQDN of the address this cluster
    # egresses from. Receiving MTAs check it against that IP's PTR record.
    helo: ""
    port: 25
    # DKIM signing. The transport starts without it and logs a prominent
    # warning, but unsigned mail from an unfamiliar IP is spam to every large
    # mailbox provider. All three must be set together, or none.
    #   openssl genrsa -out dkim.key 2048
    #   openssl rsa -in dkim.key -pubout -outform der | base64 -w0
    # then publish TXT at <selector>._domainkey.<domain>:
    #   "v=DKIM1; k=rsa; p=<base64>"
    dkim:
      domain: ""
      selector: ""
      # PEM block, verbatim (a Secret carries the newlines fine).
      privateKey: ""  # -> Secret

  # --- transport: resend ---
  resend:
    apiKey: ""  # -> Secret
    # Overrides https://api.resend.com/emails. Leave empty.
    endpoint: ""

# --- Dependencies -------------------------------------------------------------
postgresql:
  enabled: true
  # standalone, NOT replication.
  #
  # The app opens a single DSN (DBConfig.DSN) with no read/write split, so a
  # read replica is never queried, and Bitnami's `replication` architecture is
  # async streaming with manual promotion — it is not automatic failover. It
  # also renames the Service to <release>-postgresql-primary, which the
  # ConfigMap does not point at. Advertising HA the app cannot use is worse than
  # not having it: for real HA, run an operator-managed cluster (CloudNativePG,
  # Crunchy) or a managed service and set postgresql.enabled=false plus
  # externalDatabase.* / DATABASE_URL below.
  architecture: standalone
  auth:
    database: superops
    username: superops
    password: ""  # REQUIRED
  primary:
    persistence:
      size: 10Gi

externalDatabase:
  host: ""
  port: 5432
  # Full DSN override, passed to the app as DATABASE_URL. Use this for a pooler
  # (pgbouncer) or target_session_attrs=read-write against a managed cluster.
  # Takes precedence over every other DB_* setting.
  url: ""

redis:
  enabled: true
  # standalone, NOT replication+sentinel.
  #
  # pkg/redis uses redis.NewClient with a fixed Addr, not NewFailoverClient with
  # MasterName/SentinelAddrs, so the app cannot follow a Sentinel failover under
  # any addressing scheme; enabling Sentinel only breaks the Service name the
  # ConfigMap resolves. Use a managed Redis (or add failover support to
  # pkg/redis) before claiming HA here.
  architecture: standalone
  auth:
    enabled: true
    password: ""  # REQUIRED
  master:
    persistence:
      size: 2Gi

externalRedis:
  host: ""

nats:
  enabled: true
  # The nats chart pinned in Chart.yaml (~1.2) reads these under `config`.
  # The old top-level nats.jetstream / nats.cluster keys were silently ignored,
  # so JetStream was OFF and cmd/worker degraded to fire-and-forget core NATS.
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          size: 10Gi
    cluster:
      enabled: true
      replicas: 3

externalNats:
  host: ""

# Object storage settings the application reads. The `minio` block below decides
# whether this chart INSTALLS a MinIO server; this block decides what the
# application talks to. They are separate because "s3" is a supported backend
# with no in-cluster server at all.
storage:
  # "minio" (default) or "s3". Both are the same S3 implementation with
  # different defaults; anything else fails at boot rather than falling through.
  backend: minio
  bucket: superops
  useSSL: false
  # s3 only. Leave endpoint empty to derive it from the region.
  endpoint: ""
  region: ""
  # Unset means "whatever this backend should do" — path style on for minio, off
  # for s3; bucket creation on for minio, off for s3. Set only to override.
  pathStyle: ""
  createBucket: ""

minio:
  enabled: true
  auth:
    rootUser: minioadmin
    rootPassword: ""  # REQUIRED
  persistence:
    size: 20Gi

externalMinio:
  host: ""

# Meilisearch is NOT a chart dependency (see Chart.yaml), so nothing here
# deploys it. Point externalMeilisearch.host at an existing instance to enable
# search, otherwise search stays disabled — which is what actually happened
# before, silently, while values advertised meilisearch.enabled: true.
search:
  enabled: false

externalMeilisearch:
  host: ""       # e.g. http://meilisearch.search.svc.cluster.local:7700
  masterKey: ""

# --- Unified inbox -----------------------------------------------------------
# One "what needs my attention" list across every pillar, coalesced per subject.
# The only tuning it has is the digest's two windows; everything else about it is
# per-user preference (PUT /api/v1/notification-prefs) rather than deployment
# configuration.
inbox:
  # How long an item must sit untouched before it is eligible for a digest. This
  # is what collapses a burst: any new event resets the item's clock and pushes
  # it back out of the window, so forty mentions in one channel become one line
  # in one email rather than forty emails.
  digestQuietPeriod: 10m
  # Hard ceiling on digest volume per person per workspace. A user who chooses
  # email="immediate" for a notification kind is gated by the same counter, so
  # that choice cannot exceed this budget.
  digestMinInterval: 1h

# --- Audit -------------------------------------------------------------------
audit:
  # Deployment-wide retention, enforced by DROPPING monthly partitions rather
  # than by a batched DELETE (migration 021). 0 disables retention.
  #
  # There is deliberately no per-workspace setting: rows with different lifetimes
  # sharing a partition would turn the DROP back into the DELETE this design
  # exists to avoid. A self-hosted company's retention policy is a property of
  # the company.
  retentionDays: 365

  # Off-box anchoring of the per-workspace audit hash chain.
  #
  # READ THIS BEFORE RELYING ON TAMPER-EVIDENCE. The chain lives in the same
  # database as the rows it protects, so anyone who can UPDATE audit_logs can
  # recompute the whole chain. It becomes meaningful only for the entries whose
  # head has been shipped somewhere that person cannot rewrite.
  # GET /api/v1/admin/audit-logs/verify reports head_seq and anchored_seq per
  # workspace; everything ABOVE anchored_seq is protected by nothing but a chain
  # in a database an administrator can edit.
  #
  #   log   (default) — writes the anchor to the pod's log. A real anchor in any
  #                     cluster whose log pipeline already ships off-cluster,
  #                     which is most of them. If yours does not, this is not an
  #                     anchor and you should say so out loud rather than
  #                     assuming otherwise.
  #   file            — appends NDJSON to sinkPath. Meaningful only if that path
  #                     is a volume the application cannot rewrite; mount it
  #                     read-only-after-write or on WORM storage, or it is the
  #                     log transport with extra steps.
  #   http            — POSTs to sinkEndpoint, HMAC-SHA256 signed with
  #                     sinkSecret in X-SuperOps-Signature. sinkSecret is
  #                     REQUIRED and renders into the release Secret.
  #
  # A transport named without its credentials FAILS THE BOOT of both the backend
  # and the worker, rather than failing quietly the first time a chain needed
  # anchoring.
  sink: log
  # sinkPath: /var/log/superops/audit-anchors.ndjson
  # sinkEndpoint: https://siem.example.com/superops/anchors
  # sinkSecret: ""  # -> Secret, when sink is "http"
  sinkTimeout: 10s

  # Per-IP budget for GET /admin/audit-logs/export and
  # POST /admin/audit-sink/test. The export is one request that can return a lot
  # of rows — the highest-value single request in the product — so it carries its
  # own limit rather than the general API's 600/min.
  exportPerMinute: 6

  # Tier 2 buffer (file downloads, sensitive reads), off the request's critical
  # path. Empty uses the built-in defaults (4096 deep, 2 workers).
  #
  # A full buffer DROPS — counted, logged, and exported on /metrics as
  # superops_audit_dropped_total. ALERT ON IT. The buffer fills exactly when the
  # load is interesting, and silently dropping audit records during an incident
  # is the failure that makes the whole surface worthless. Tier 1 (authentication,
  # authorization changes, sharing, configuration) never touches this queue.
  # bufferSize: 4096
  # bufferWorkers: 2

# Baseline response security headers.
#
# nginx does NOT inherit add_header from an outer block into a block that
# declares its own add_header, so this snippet is `include`d in every location
# that sets headers of its own (e.g. the immutable-asset caches) as well as at
# server level.
#
# $hsts_header is mapped from $scheme in nginx-upstream.conf and is empty over
# plain HTTP; nginx does not emit an add_header with an empty value.
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# The Expo/react-native-web bundle needs inline styles and eval (Hermes/worklets
# fall back to eval on web). Tighten this once the bundle is verified without.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

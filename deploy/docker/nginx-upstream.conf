# http-context snippet: backend upstream + WebSocket connection mapping.
# Included by nginx-frontend.conf and nginx-frontend-tls.conf so the two server
# definitions cannot drift apart.
upstream superops_backend {
    server backend:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HSTS is only meaningful over TLS. nginx omits an add_header whose value is the
# empty string, so this keeps one headers snippet valid for both server blocks.
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

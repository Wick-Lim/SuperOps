# Alert rules for the metrics the backend actually exports
# (see backend/internal/app/metrics.go). No Alertmanager is bundled, so these
# evaluate and show up under Prometheus → Alerts; point Prometheus at an
# alertmanager to route them.
groups:
  - name: superops-availability
    rules:
      - alert: SuperOpsBackendDown
        expr: up{job="superops-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SuperOps backend scrape target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}. If /metrics is protected, check that METRICS_TOKEN matches deploy/docker/secrets/metrics_token."

      - alert: SuperOpsHighErrorRate
        expr: |
          sum(rate(superops_http_requests_total{status="5xx"}[5m]))
            /
          clamp_min(sum(rate(superops_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of HTTP responses are 5xx"
          description: "5xx ratio has been above 5% for 10 minutes."

      - alert: SuperOpsHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(superops_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 1s"

  - name: superops-resources
    rules:
      - alert: SuperOpsDBPoolSaturated
        expr: |
          superops_db_pool_conns{state="acquired"}
            / clamp_min(superops_db_pool_max_conns, 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres pool over 90% acquired"
          description: "Raise DB_MAX_CONNS or find the query holding connections."

      - alert: SuperOpsDBPoolStarvation
        expr: rate(superops_db_pool_acquires_total{result="empty"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests are waiting for a free Postgres connection"

      - alert: SuperOpsGoroutineLeak
        expr: go_goroutines > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Goroutine count above 5000"
          description: "Sustained growth usually means WebSocket pumps are not being reaped."

      - alert: SuperOpsRestarted
        expr: superops_uptime_seconds < 300
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Backend process restarted in the last 5 minutes"

      # The Tier 2 audit buffer (file downloads, sensitive reads) drops when it
      # is full. That is by design and it is counted rather than silent — but a
      # buffer fills exactly when the load is interesting, i.e. during the
      # incident whose trail you will later want to read. Any drop at all is
      # worth waking up for, because the records are not recoverable.
      - alert: SuperOpsAuditRecordsDropped
        expr: increase(superops_audit_dropped_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Audit records were dropped by a full buffer"
          description: >-
            Egress and sensitive-read audit entries are being discarded and cannot be
            recovered. Raise AUDIT_BUFFER_SIZE / AUDIT_BUFFER_WORKERS, or find what is
            making the audit writes slow. Tier 1 (authentication, authorization changes,
            sharing, configuration) is synchronous and is unaffected.

      # audit.Try swallows write failures by design — a failed audit write must
      # not turn a successful login into a 500 — which means a broken audit path
      # is otherwise invisible outside the logs.
      - alert: SuperOpsAuditWriteFailures
        expr: increase(superops_audit_write_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Audit writes are failing"
          description: >-
            The audit trail has gaps. Most likely a missing monthly partition (the
            worker's audit_partitions job has stopped — check its /health entry) or a
            constraint rejection.

# server-context snippet: the whole routing table for the web client.
# Included by both nginx-frontend.conf (:80) and nginx-frontend-tls.conf (:443),
# which is why there is exactly one definition of each route in this repo.
#
# Every location here is a prefix or exact match — there are deliberately no
# regex locations. nginx selects the longest matching prefix location and
# *remembers* it, then evaluates regex locations in order and the first regex
# match wins outright
# (https://nginx.org/en/docs/http/ngx_http_core_module.html#location).
# The old `location ~ ^/(api|health|ready|metrics)` regex therefore swallowed
# WebSocket upgrades and served them without proxy_http_version 1.1 or the
# Upgrade/Connection headers, breaking realtime entirely. The `^~` modifier makes
# that class of mistake impossible: when the longest matching prefix location
# carries `^~`, regex locations are not checked at all.

# WebSocket upgrade.
location ^~ /api/v1/ws {
    proxy_pass http://superops_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# REST API → backend (same-origin for the web client).
location ^~ /api/ {
    proxy_pass http://superops_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://superops_backend;
    proxy_set_header Host $host;
    access_log off;
}

# /ready and /metrics are operator endpoints. Prometheus scrapes the backend
# directly over the compose network (see prometheus.yml), so neither needs to be
# reachable from the internet — and /metrics is unauthenticated unless
# METRICS_TOKEN is set.
location = /ready {
    return 404;
}
location = /metrics {
    return 404;
}

# Hashed static assets can be cached aggressively. These blocks declare their own
# add_header, which suppresses inheritance, so the security headers are
# re-included.
location ^~ /_expo/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}
location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

# SPA fallback.
location / {
    try_files $uri $uri/ /index.html;
}

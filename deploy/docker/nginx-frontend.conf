# Plain-HTTP front door (default). For TLS use docker-compose.tls.yml, which
# swaps in nginx-frontend-tls.conf.
include /etc/nginx/snippets/upstream.conf;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/app-locations.conf;
}

# TLS front door. Activated by docker-compose.tls.yml, which mounts this file
# over /etc/nginx/conf.d/default.conf and mounts ./certs into the container:
#
#   deploy/docker/certs/fullchain.pem
#   deploy/docker/certs/privkey.pem
#
#   cd deploy/docker && docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# The routing table is the shared snippet, so HTTP and HTTPS cannot drift.
include /etc/nginx/snippets/upstream.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # ACME http-01 challenge, if you terminate certs with certbot/webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Includes HSTS, which the $scheme map switches on for https.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/app-locations.conf;
}

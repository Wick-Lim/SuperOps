name: Release

on:
  push:
    tags: ['v*']

# GHCR repository names must be lowercase. github.repository_owner is the
# literal "Wick-Lim", which Docker rejects ("repository name must be
# lowercase"), so the owner is hardcoded in lowercase here — matching
# deploy/k8s/helm/superops/values.yaml.
env:
  REGISTRY: ghcr.io
  OWNER: wick-lim

permissions:
  contents: read

jobs:
  # Nothing is published unless the tagged commit passes the full pipeline.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            image: superops-backend
            dockerfile: deploy/docker/Dockerfile.backend
          - name: frontend
            image: superops-frontend
            dockerfile: deploy/docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          image="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          tags="${image}:${GITHUB_REF_NAME}"
          # Only a final release moves :latest. A pre-release such as
          # v1.0.0-rc1 must never repoint latest.
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags}"$'\n'"${image}:latest"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-release tag ${GITHUB_REF_NAME}: not moving :latest"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

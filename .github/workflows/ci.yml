name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml depend on a full CI run for the tagged commit
  # (`needs:` cannot reference jobs in another workflow).
  workflow_call:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres, and only Postgres. internal/inbox and internal/audit carry
    # DB-backed unit tests that cannot be expressed against a mocked pool — the
    # ON CONFLICT DO NOTHING row count that gates the coalesced inbox counter, a
    # monthly partition rotating, a hash chain surviving an UPDATE issued behind
    # the application's back. Without a reachable database they SKIP, which is
    # how a suite silently goes green over exactly the mechanisms it exists to
    # protect.
    #
    # Redis/NATS/Meilisearch are deliberately absent: the packages that need
    # them skip here and are covered by the `integration` job, which has all of
    # them and fails rather than skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superops
          POSTGRES_PASSWORD: superops
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U superops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: superops
      DB_PASSWORD: superops
      DB_MAINTENANCE_NAME: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          # Pinned: an unpinned linter silently changes the rule set between
          # runs, and v2 is what backend/.golangci.yml is written against.
          version: v2.12.2

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Unit tests
        working-directory: backend
        # SUPEROPS_REQUIRE_INFRA is NOT set here: it would force the Redis, NATS
        # and Meilisearch tests to fail in a job that deliberately has none of
        # them. Postgres is reachable, so the database-backed tests run rather
        # than skip — which is the point of the service above — and the step
        # below proves they actually did.
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Assert the database-backed tests actually ran
        working-directory: backend
        # A skip is invisible in `go test` output that is otherwise all "ok", and
        # these are the tests guarding the inbox's idempotency gate and the audit
        # chain. Naming one from each package turns "Postgres was unreachable"
        # from a silent green into a failure.
        run: |
          go test ./internal/inbox/ ./internal/audit/ -count=1 -v \
            -run 'TestRedeliveryMovesTheCounterExactlyOnce|TestChainDetectsTamper' \
            | tee /tmp/dbtests.txt
          grep -q -- '--- PASS: TestRedeliveryMovesTheCounterExactlyOnce' /tmp/dbtests.txt \
            || { echo "::error::the inbox idempotency test did not run (Postgres unreachable?)"; exit 1; }
          grep -q -- '--- PASS: TestChainDetectsTamper' /tmp/dbtests.txt \
            || { echo "::error::the audit chain test did not run (Postgres unreachable?)"; exit 1; }

      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        working-directory: backend
        run: govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superops
          POSTGRES_PASSWORD: superops
          POSTGRES_DB: superops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U superops"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # NATS is deliberately NOT a service container — see "Start NATS" below.
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: superops
      DB_PASSWORD: superops
      DB_NAME: superops
      DB_SSLMODE: disable
      REDIS_ADDR: localhost:6379
      # Set-but-empty means "no password" — the CI redis runs without
      # requirepass. The harness distinguishes unset from empty (os.LookupEnv),
      # so this no longer falls back to the compose default and fails AUTH.
      REDIS_PASSWORD: ''
      NATS_URL: nats://localhost:4222
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long
      ADMIN_EMAIL: admin@company.com
      ADMIN_PASSWORD: changeme_admin_password
      # No object storage or Meilisearch in CI. The *_ENABLED switches are the
      # documented way to turn them off and the only one that works: env.str
      # treats a set-but-empty variable as unset and returns the default, so
      # MEILI_HOST='' meant "http://localhost:7700" and the app spent every boot
      # failing to reach a service nobody had started.
      SEARCH_ENABLED: 'false'
      FILES_ENABLED: 'false'
      # GitHub sets CI=true, which makes the harness fail instead of skip when
      # the infrastructure is unreachable. A suite that cannot go red is not a
      # suite.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      # JetStream must be on: the API and the worker publish with
      # PublishDurable, which waits for a stream ack, so against a server
      # started without -js every publish in this suite fails — while
      # docker-compose and the Helm chart both enable it. A service container
      # cannot express this: GitHub Actions services accept only image /
      # credentials / env / ports / volumes / options, none of which sets the
      # container command, and `options` is emitted before the image name so a
      # bare `-js` there would be parsed as a docker flag. Running the server as
      # a step is the way to own its command line; the runner has docker and the
      # job itself is not containerised, so localhost:4222 still reaches it.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2 -js -m 8222

      - name: Wait for NATS JetStream
        run: |
          for _ in $(seq 1 60); do
            # js-enabled-only makes this an assertion rather than a liveness
            # ping: /healthz answers 503 while JetStream is unavailable, so a
            # server that somehow came up without -js fails here loudly instead
            # of at the first publish inside a test.
            if curl -fsS "http://127.0.0.1:8222/healthz?js-enabled-only=true" >/dev/null; then
              echo "NATS JetStream ready"
              exit 0
            fi
            sleep 1
          done
          docker logs nats || true
          echo "NATS JetStream never became ready on 8222" >&2
          exit 1

      - name: Run migrations
        working-directory: backend
        run: go run ./cmd/migrate -direction up

      - name: Integration tests
        working-directory: backend
        # -race: the hub, the NATS bridge and the event relay are only reachable
        # from this suite, so without it the concurrent code is never checked.
        run: go test -tags=integration ./test/integration/... -race -count=1 -v

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run typecheck

      - name: Audit runtime dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=critical

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        # Needs the dependency graph enabled on the repository; do not block the
        # pipeline where it is unavailable.
        continue-on-error: true
        with:
          fail-on-severity: high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deploy/docker/Dockerfile.backend -t superops-backend:ci .
      - name: Build frontend (web) image
        run: docker build -f deploy/docker/Dockerfile.frontend -t superops-frontend:ci .

  helm:
    runs-on: ubuntu-latest
    env:
      HELM_SETS: >-
        --set jwt.secret=ci-secret-at-least-32-characters-long
        --set admin.password=ci-admin-password
        --set postgresql.auth.password=ci-pg
        --set redis.auth.password=ci-redis
        --set minio.auth.rootPassword=ci-minio
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render chart
        run: |
          # nats is an HTTPS repo (bitnami deps are OCI and need no add).
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm dependency build deploy/k8s/helm/superops
          helm lint deploy/k8s/helm/superops $HELM_SETS
          helm template superops deploy/k8s/helm/superops $HELM_SETS > /dev/null
          # A release name that is NOT "superops": every subchart Service name
          # is derived from the release name, and the chart used to assume one.
          helm template prod deploy/k8s/helm/superops $HELM_SETS > /tmp/prod.yaml
          grep -q 'DB_HOST: "prod-postgresql"' /tmp/prod.yaml \
            || { echo "DB_HOST does not match the postgresql subchart Service name"; exit 1; }
          grep -q 'ADMIN_PASSWORD' /tmp/prod.yaml \
            || { echo "ADMIN_PASSWORD missing — LoadConfig fatals without it"; exit 1; }

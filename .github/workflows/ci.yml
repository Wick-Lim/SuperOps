name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml depend on a full CI run for the tagged commit
  # (`needs:` cannot reference jobs in another workflow).
  workflow_call:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres, and only Postgres. internal/inbox and internal/audit carry
    # DB-backed unit tests that cannot be expressed against a mocked pool — the
    # ON CONFLICT DO NOTHING row count that gates the coalesced inbox counter, a
    # monthly partition rotating, a hash chain surviving an UPDATE issued behind
    # the application's back. Without a reachable database they SKIP, which is
    # how a suite silently goes green over exactly the mechanisms it exists to
    # protect.
    #
    # Redis/NATS/Meilisearch are deliberately absent here; the packages that
    # need them skip in THIS job and are re-run with real services by the
    # `integration` job's "Infrastructure-backed unit tests" step.
    #
    # That claim used to be false. The integration job ran
    # `./test/integration/...` and nothing else, so 21 tests — all of pkg/nats,
    # pkg/redis, internal/storage's conformance suite, internal/collab's
    # cross-replica tests and internal/search's Meilisearch tests — ran in NO
    # job at all, while a comment said they were covered. One of them was red
    # the first time it was actually executed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superops
          POSTGRES_PASSWORD: superops
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U superops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: superops
      DB_PASSWORD: superops
      DB_MAINTENANCE_NAME: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          # Pinned: an unpinned linter silently changes the rule set between
          # runs, and v2 is what backend/.golangci.yml is written against.
          version: v2.12.2

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Unit tests
        working-directory: backend
        # SUPEROPS_REQUIRE_INFRA is NOT set here: it would force the Redis, NATS
        # and Meilisearch tests to fail in a job that deliberately has none of
        # them. Postgres is reachable, so the database-backed tests run rather
        # than skip — which is the point of the service above — and the step
        # below proves they actually did.
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Assert the database-backed tests actually ran
        working-directory: backend
        # A skip is invisible in `go test` output that is otherwise all "ok", and
        # these are the tests guarding the inbox's idempotency gate and the audit
        # chain. Naming one from each package turns "Postgres was unreachable"
        # from a silent green into a failure.
        run: |
          go test ./internal/inbox/ ./internal/audit/ -count=1 -v \
            -run 'TestRedeliveryMovesTheCounterExactlyOnce|TestChainDetectsTamper' \
            | tee /tmp/dbtests.txt
          grep -q -- '--- PASS: TestRedeliveryMovesTheCounterExactlyOnce' /tmp/dbtests.txt \
            || { echo "::error::the inbox idempotency test did not run (Postgres unreachable?)"; exit 1; }
          grep -q -- '--- PASS: TestChainDetectsTamper' /tmp/dbtests.txt \
            || { echo "::error::the audit chain test did not run (Postgres unreachable?)"; exit 1; }

      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        # PINNED, for the same reason golangci-lint is: @latest silently changes
        # the rule set between runs, so a green result stops being comparable to
        # the previous green result and a new finding looks like a regression in
        # this tree. Bump deliberately.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan
        working-directory: backend
        run: govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superops
          POSTGRES_PASSWORD: superops
          POSTGRES_DB: superops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U superops"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # NATS is deliberately NOT a service container — see "Start NATS" below.
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: superops
      DB_PASSWORD: superops
      DB_NAME: superops
      DB_SSLMODE: disable
      REDIS_ADDR: localhost:6379
      # Set-but-empty means "no password" — the CI redis runs without
      # requirepass. The harness distinguishes unset from empty (os.LookupEnv),
      # so this no longer falls back to the compose default and fails AUTH.
      REDIS_PASSWORD: ''
      NATS_URL: nats://localhost:4222
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long
      ADMIN_EMAIL: admin@company.com
      ADMIN_PASSWORD: changeme_admin_password
      # Meilisearch and MinIO are REAL here, started as steps below.
      #
      # They used to be absent, with SEARCH_ENABLED/FILES_ENABLED set to
      # 'false'. That did nothing: the integration harness builds its config as
      # a literal (harness_test.go's buildConfig) and never calls LoadConfig, so
      # it hardcodes MinIO.Enabled = true and Meili.Enabled = true and reads the
      # endpoints straight from the environment. The switches were read by
      # nobody in this job. What the harness actually got was the DEFAULT
      # endpoints — localhost:7700 and localhost:19000 — pointing at nothing,
      # and 13 tests failed while 4 skipped. The switches are kept, and true,
      # because cmd/migrate and any future non-harness boot in this job do read
      # them.
      SEARCH_ENABLED: 'true'
      FILES_ENABLED: 'true'
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci_meili_master_key_at_least_16_bytes
      MINIO_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: superops
      # GitHub sets CI=true, which makes the harness fail instead of skip when
      # the infrastructure is unreachable. A suite that cannot go red is not a
      # suite.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      # JetStream must be on: the API and the worker publish with
      # PublishDurable, which waits for a stream ack, so against a server
      # started without -js every publish in this suite fails — while
      # docker-compose and the Helm chart both enable it. A service container
      # cannot express this: GitHub Actions services accept only image /
      # credentials / env / ports / volumes / options, none of which sets the
      # container command, and `options` is emitted before the image name so a
      # bare `-js` there would be parsed as a docker flag. Running the server as
      # a step is the way to own its command line; the runner has docker and the
      # job itself is not containerised, so localhost:4222 still reaches it.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2 -js -m 8222

      # Meilisearch and MinIO are steps rather than service containers for the
      # same two reasons NATS is. MinIO needs a command (`server /data`), which
      # the services: block cannot express. Meilisearch's image carries no curl
      # or wget, so a service-level --health-cmd has nothing to run; the runner
      # does have curl, which is why the readiness loops live here.
      - name: Start Meilisearch and MinIO
        run: |
          docker run -d --name meili -p 7700:7700 \
            -e MEILI_MASTER_KEY=ci_meili_master_key_at_least_16_bytes \
            -e MEILI_NO_ANALYTICS=true \
            -e MEILI_ENV=development \
            getmeili/meilisearch:v1.11
          docker run -d --name minio -p 19000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

      - name: Wait for Meilisearch and MinIO
        run: |
          ready() {
            for _ in $(seq 1 60); do
              curl -fsS "$2" >/dev/null 2>&1 && { echo "$1 ready"; return 0; }
              sleep 1
            done
            docker logs "$1" || true
            echo "::error::$1 never became ready at $2"
            return 1
          }
          # MinIO's live probe is unauthenticated; Meilisearch's /health is too.
          ready meili http://127.0.0.1:7700/health
          ready minio http://127.0.0.1:19000/minio/health/live
          # The bucket is created by app.New (the minio provider defaults
          # CreateBucket to true), so nothing mints it here — and if that
          # default ever flips, the upload tests fail rather than skip.

      - name: Wait for NATS JetStream
        run: |
          for _ in $(seq 1 60); do
            # js-enabled-only makes this an assertion rather than a liveness
            # ping: /healthz answers 503 while JetStream is unavailable, so a
            # server that somehow came up without -js fails here loudly instead
            # of at the first publish inside a test.
            if curl -fsS "http://127.0.0.1:8222/healthz?js-enabled-only=true" >/dev/null; then
              echo "NATS JetStream ready"
              exit 0
            fi
            sleep 1
          done
          docker logs nats || true
          echo "NATS JetStream never became ready on 8222" >&2
          exit 1

      # UP, DOWN, UP — the replay docs/plans/README.md already promises.
      #
      # It says "Every up has a down, and the down is tested by replaying
      # up -> down -> up against a real database." Nothing did: no test ran a
      # down migration and CI ran `-direction up` alone, so the first .down.sql
      # that failed to apply would have been discovered during a production
      # rollback.
      #
      # Run against a THROWAWAY database, so a broken down cannot leave the
      # integration suite's schema half-reverted and turn one failure into a
      # whole red job with an unrelated cause.
      - name: Migrations replay up -> down -> up
        working-directory: backend
        env:
          DB_NAME: superops_migrate_replay
        run: |
          PGPASSWORD=superops psql -h localhost -U superops -d postgres \
            -c 'DROP DATABASE IF EXISTS superops_migrate_replay' \
            -c 'CREATE DATABASE superops_migrate_replay'
          go run ./cmd/migrate -direction up
          go run ./cmd/migrate -direction down -i-know-this-drops-everything
          go run ./cmd/migrate -direction up
          PGPASSWORD=superops psql -h localhost -U superops -d postgres \
            -c 'DROP DATABASE superops_migrate_replay'

      - name: Run migrations
        working-directory: backend
        run: go run ./cmd/migrate -direction up

      - name: Integration tests
        working-directory: backend
        # -race: the hub, the NATS bridge and the event relay are only reachable
        # from this suite, so without it the concurrent code is never checked.
        run: |
          set -o pipefail
          # -timeout: Go's default is 10 minutes for the whole PACKAGE, and this
          # suite legitimately runs longer — it waits on real JetStream
          # delivery. Hitting the default produces a panic with no failing
          # assertion in it, which reads as a broken pipeline rather than a
          # slow one.
          go test -tags=integration ./test/integration/... -race -count=1 -v -timeout 25m \
            | tee /tmp/integration.txt

      # THE PACKAGES THE BACKEND JOB CANNOT RUN.
      #
      # Object-storage conformance, JetStream publish/drain, Redis client
      # construction and cross-replica NATS fan-out are verified nowhere else.
      # SUPEROPS_REQUIRE_INFRA=1 turns "the service is missing" from a skip into
      # a failure, which is the only way a gate like this stays honest.
      - name: Infrastructure-backed unit tests
        working-directory: backend
        env:
          SUPEROPS_REQUIRE_INFRA: "1"
        run: |
          set -o pipefail
          go test ./internal/... ./pkg/... -race -count=1 -v -timeout 20m | tee /tmp/infra-units.txt
          if grep -q -- '--- SKIP' /tmp/infra-units.txt; then
            echo "::error::a unit test skipped with every service running; it is gated on something it should not be"
            grep -- '--- SKIP' /tmp/infra-units.txt
            exit 1
          fi

      - name: Assert nothing skipped
        # Every skip in this suite is "the infrastructure this test needs is not
        # here". That is precisely how it went green for months over a broken
        # config, so a skip is a failure: either the service is down or a test
        # grew a gate it should not have. This job now runs Postgres, Redis,
        # NATS, Meilisearch and MinIO, which is every dependency the harness
        # knows about, so the correct number is zero.
        run: |
          if grep -q -- '--- SKIP' /tmp/integration.txt; then
            echo "::error::the integration suite skipped tests; every dependency is running, so a skip means a test is gated on something it should not be"
            grep -- '--- SKIP' /tmp/integration.txt
            exit 1
          fi
          echo "0 skipped"

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run typecheck

      # The vitest suite existed and was never run here. Every client-side
      # correctness claim in the editor phases — CRDT convergence, the
      # projection extractor, the "an embed node carries no title" invariant —
      # is made in it, and a suite CI does not run is a suite that cannot fail.
      - name: Unit tests
        working-directory: app
        run: npm test

      # THE BUNDLE CHECK. The document editor is TipTap/ProseMirror, which is
      # DOM-only, so it lives in Editor.web.tsx and the phones get a read-only
      # renderer instead. Nothing else can verify that split: both files
      # type-check, both render something, and a resolution mistake shows up as
      # "the editor is missing" on one platform or "+400 KB" on the other.
      #
      # It has already caught one. The first version of the tsc shim was an
      # `Editor.ts` re-export, which Metro resolved AHEAD of the platform
      # variants — so the web build shipped the read-only native renderer and
      # the editor silently did not exist. It is a `.d.ts` now, which Metro
      # cannot pick.
      - name: Bundle check — the editor is web-only
        working-directory: app
        run: |
          set -euo pipefail
          npx expo export --platform web --output-dir /tmp/bundle-web >/dev/null
          npx expo export --platform ios --output-dir /tmp/bundle-ios >/dev/null

          web=$(ls /tmp/bundle-web/_expo/static/js/web/*.js | head -1)
          # iOS ships Hermes bytecode; its string table still carries literals.
          ios=$(ls /tmp/bundle-ios/_expo/static/js/ios/* | head -1)

          # STRINGS ONCE, INTO A FILE. Never `strings "$ios" | grep -q`.
          #
          # `grep -q` exits on its FIRST match, `strings` then dies of SIGPIPE
          # (141), and `set -o pipefail` makes the whole pipeline exit 141. So
          # every leak check was false exactly when the string WAS present —
          # the detectors could not fire, by construction — and the two presence
          # checks, which use `|| error`, failed on a correct bundle. This step
          # was simultaneously blind and red.
          #
          # Reproduced: PIPESTATUS=141 0 on a 25 MB input with an early match.
          # Reading the table into a file removes the pipe, and it also runs
          # `strings` once instead of four times.
          strings "$ios" > /tmp/ios-strings.txt

          leak() {
            if grep -q${3:-} -- "$1" /tmp/ios-strings.txt; then
              echo "::error::$2"
              exit 1
            fi
          }
          present() {
            grep -q -- "$1" /tmp/ios-strings.txt || { echo "::error::$2"; exit 1; }
          }

          grep -q 'superops-editor' "$web" \
            || { echo "::error::the web bundle has no editor — the platform split resolved the wrong file"; exit 1; }
          grep -qi 'livekit' "$web" \
            || { echo "::error::the web bundle has no call client — the huddle platform split resolved the wrong file"; exit 1; }

          leak 'prosemirror' 'prosemirror leaked into the iOS bundle; the mobile app grew ~400 KB for a feature it does not have'
          leak 'livekit' 'livekit-client leaked into the iOS bundle; that is ~200 KB of WebRTC for a join path the mobile dev-build cut removes' i
          present 'Editing documents is available on the web' 'the iOS bundle has no document renderer at all'
          present 'Join this huddle from the web app' 'the iOS bundle has no huddle surface at all'

          # SELF-CHECK. The bug above made these assertions carry no information
          # while still printing a verdict, so the step now proves its own
          # detector works before trusting its silence: a string that is
          # certainly in the table must be found, and one that certainly is not
          # must not be.
          grep -q -- 'Editing documents is available on the web' /tmp/ios-strings.txt \
            || { echo "::error::the leak detector cannot find a string that is present; its silence means nothing"; exit 1; }
          if grep -q -- 'zzz-this-string-is-never-in-any-bundle-zzz' /tmp/ios-strings.txt; then
            echo "::error::the leak detector matches a string that cannot be present"
            exit 1
          fi
          echo "editor and call client are web-only; both native fallbacks are present"

      # A GATE THAT CANNOT RUN IS NOT A GATE THAT PASSED.
      #
      # `npm audit` posts to registry.npmjs.org's `security/audits/quick`
      # endpoint, which npm is retiring — it now answers 400 "Invalid package
      # tree" for trees that are demonstrably fine (`npm ci` clean, no unmet
      # peers, every lock entry resolved). Verified by running it against an
      # older commit whose audit was green: that fails too, so it is the
      # service, not this repository.
      #
      # Both outcomes are RED, and the step says which. Reporting an
      # unreachable advisory service as a pass is how a security gate quietly
      # stops being one; reporting it as "vulnerabilities found" sends somebody
      # hunting for a package that is not there. The fix when this fires is an
      # npm upgrade to a version that uses the bulk advisory endpoint, not a
      # change here.
      - name: Audit runtime dependencies
        working-directory: app
        run: |
          set +e
          out=$(npm audit --omit=dev --audit-level=critical 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then
            echo "no critical advisories"
            exit 0
          fi
          if echo "$out" | grep -q 'audit endpoint returned an error'; then
            echo "::error::the dependency audit could NOT RUN — npm's advisory endpoint refused the request. This is not a vulnerability finding, and it is not a reason to merge: fix the tooling (npm version) or the gate is decorative."
            exit 1
          fi
          echo "::error::critical advisories in runtime dependencies"
          exit 1

  # ADVISORY, AND LABELLED AS SUCH.
  #
  # `continue-on-error` makes `fail-on-severity` inert — this job cannot fail the
  # pipeline — and `if: pull_request` means it does not run at all when
  # release.yml calls this workflow for a tag, while `needs: ci` is still
  # satisfied. So nothing published by a release has ever been dependency
  # reviewed, and the job's presence in a green run implied otherwise.
  #
  # Both are kept, because the action needs the dependency graph enabled on the
  # repository and there is no diff to review on a tag push. The name now says
  # what it is, so a green pipeline is not read as "dependencies were gated".
  # govulncheck above is the gate that actually blocks.
  dependency-review-advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deploy/docker/Dockerfile.backend -t superops-backend:ci .
      - name: Build frontend (web) image
        run: docker build -f deploy/docker/Dockerfile.frontend -t superops-frontend:ci .

  helm:
    runs-on: ubuntu-latest
    env:
      HELM_SETS: >-
        --set jwt.secret=ci-secret-at-least-32-characters-long
        --set admin.password=ci-admin-password
        --set postgresql.auth.password=ci-pg
        --set redis.auth.password=ci-redis
        --set minio.auth.rootPassword=ci-minio
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render chart
        run: |
          # nats is an HTTPS repo (bitnami deps are OCI and need no add).
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm dependency build deploy/k8s/helm/superops
          helm lint deploy/k8s/helm/superops $HELM_SETS
          helm template superops deploy/k8s/helm/superops $HELM_SETS > /dev/null
          # A release name that is NOT "superops": every subchart Service name
          # is derived from the release name, and the chart used to assume one.
          helm template prod deploy/k8s/helm/superops $HELM_SETS > /tmp/prod.yaml
          grep -q 'DB_HOST: "prod-postgresql"' /tmp/prod.yaml \
            || { echo "DB_HOST does not match the postgresql subchart Service name"; exit 1; }
          grep -q 'ADMIN_PASSWORD' /tmp/prod.yaml \
            || { echo "ADMIN_PASSWORD missing — LoadConfig fatals without it"; exit 1; }
